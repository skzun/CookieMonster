[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cookiemonster"
version = "0.1.0"
description = "Validador de session hijacking por cookie replay (assessment de segurança autorizado)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
inject = [
    "httpx>=0.28",
    "playwright>=1.40",
    "beautifulsoup4>=4.12",
]
dev = ["pytest>=8.0"]

[project.scripts]
cookie-monster = "cookiemonster.cli:main"

[tool.setuptools.packages.find]
include = ["cookiemonster*"]

[tool.pytest.ini_options]
testpaths = ["tests"]